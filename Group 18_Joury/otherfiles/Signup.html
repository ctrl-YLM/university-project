<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign up into Joury</title>
	<style>
		body{
			font-family: 'Times New Roman', Times, serif;
			background-color: #feedaa;
		}
		.arrow{
			width: 50px; 
			padding-left: 80px;
			padding-top: 40px;
			position: absolute;
			top: 0;
			z-index: 1000;
		}
		.logo{
			width: 75px;
		}
		h2{
			font-size: 30px;
		}
		.content{
			margin: auto;
			max-width: 350px;
			text-align: center;
			padding-top: 30px;
			margin-bottom: 100px;
		}
		.inputbox{
			width: 250px;
			height: 30px;
		}
		.label{
			text-align: left;
			padding-left: 45px;
			font-size: 18px;
		}
		p{
			font-size: 13px;
		}
   		section{
	    	padding-top: 10px;
	    	margin: auto;
	    	background-color: white;
	    	border-radius: 10px;
	    	width: 430px;
	    	height: 770px;
	    	box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
	    	margin-bottom: 50px;
	    }
	    .image:hover{
	    	transform: scale(1.045);
	    	transition: transform 0.3s ease;
	    }
	</style>
</head>

<body>
	<a href="../homepage.html"><img src="icons/arrow.png" alt="arrow" class="arrow"></a>
	<section>
	<div class="content">
		<form action="success.html" method="POST">
			<img src="icons/logo.png" alt="logo" class="logo">

			<h2>Sign up for Joury</h2>

			<input class="image" type="image" src="icons/google button.png" alt="google" style="width: 200px;">

			<br>

			<input class="image" type="image" src="icons/apple button.png" alt="apple" style="width: 200px; margin-top: 5px;">

			<br>
			<br>

		<div class="label">
			<label for="name">Full name</label>
		</div>

			<br>

			<input type="text" id="name" class="inputbox" placeholder="Enter your full name" required>

			<br>
			<br>

		<div class="label">
			<label for="birth">Birth of date</label>
		</div>

			<br>

			<input type="date" id="birth" class="inputbox" required>

			<br>
			<br>

		<div class="label">
			<label for="email">Email</label>
		</div>

			<br>

			<input type="email" id="email" class="inputbox" placeholder="Enter your email" required>

			<br>
			<br>

		<div class="label">
			<label for="password">Password</label>
		</div>

			<br>

			<input type="password" id="password" class="inputbox" placeholder="Enter your password" required>

			<br>
			<br>
			<br>

			<input type="submit" style="width: 150px; cursor: pointer;" value="Create account">

			<br>
			<br>
			<br>
			<br>
		</form>

	</div>
	</section>
</body>
</html>
