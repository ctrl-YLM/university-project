<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Log in into Joury</title>
	<style>
		body{
			background-color: #feedaa;
			font-family: 'Times New Roman', Times, serif;
		}
		.arrow{
			width: 50px; 
			padding-left: 80px;
			padding-top: 40px;
			position: absolute;
			top: 0;
			z-index: 1000;
		}
		.logo{
			width: 75px;
		}
		h2{
			font-size: 30px;
		}
		.content{
			margin: auto;
			max-width: 350px;
			text-align: center;
			padding-top: 30px;
			padding-bottom: 5px;
		}
		.content2{
			padding-bottom: 10px;
			margin: auto;
			max-width: 350px;
			margin-bottom: 50px;
		}
		.inputbox{
			width: 250px;
			height: 30px;
		}
		.loginbutton{
			display: flex;
			10palign-items: center;
			justify-content: center;
			margin: 0 auto;
		}
		.label{
			text-align: left;
			padding-left: 45px;
			font-size: 18px;
		}
		p{
			font-size: 13px;
		}
		.ga {
	        display: block; 
	        margin: 10px auto; 
	        width: 200px;
    	}
	    section{
	    	padding-top: 30px;
	    	margin: auto;
	    	background-color: white;
	    	border-radius: 10px;
	    	width: 430px;
	    	height: 680px;
	    	box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
	    	margin-bottom: 50px;
	    }
	    .image:hover{
	    	transform: scale(1.045);
	    	transition: transform 0.3s ease;
	    }
	</style>
</head>

<body>
	<a href="../homepage.html"><img src="icons/arrow.png" alt="arrow" class="arrow"></a>
	<br>
	<section>
	<div class="content">
		<form action="homeprofile.html" method="POST">
			<img src="icons/logo.png" alt="logo" class="logo">

			<h2>Log in to Joury</h2>

		<div class="label">
			<label for="email">Email</label>
		</div>

			<br>

			<input type="email" id="email" class="inputbox" placeholder="Enter your email" required>

			<br>
			<br>

		<div class="label">
			<label for="password">Password</label>
		</div>

			<br>

			<input type="password" id="password" class="inputbox" placeholder="Enter your password" required>

			<br>
			<br>

		<div class="loginbutton">
			<a href=""><button type="submit" alt="login" action="success.html" style="height: 30px; width: 80px; cursor: pointer;">Log in</button></a>
		</div>
			
			<br>
			<br>
			<p>Forgot password?</p>


		</form>
	</div>

	<div class="content2">
		<form>
			<input class="ga image" type="image" src="icons/google button.png" alt="google" style="width: 200px;">


			<input class="ga image" type="image" src="icons/apple button.png" alt="apple" style="width: 200px;">
		</form>
	</div>
	</section>
</body>
</html>
